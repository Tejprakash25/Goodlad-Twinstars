<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Page not found | Goodlad Twinstars</title>
    <link rel="icon" type="image/svg+xml" href="BrandAssets/GOODLAD_TWINSTARS_logo_white_bg.svg" />
    <script src="script.js" defer></script>
    <style>
        :root {
          --ink: #263d5b; --muted: #68788c; --blue: #42668f; --violet: #594187; --surface: #f4f7fb; --line: #e3eaf2; --dark: #dce3ed;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.65 "Segoe UI", Arial, sans-serif; }
        a { color: inherit; text-decoration: none; }
        .wrap { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
        header { padding: 20px 0; border-bottom: 1px solid var(--line); }
        .logo { display: block; width: min(280px, 100%); height: auto; }
        .card { margin: 60px auto; padding: clamp(24px, 4vw, 48px); border-radius: 24px; background: var(--surface); box-shadow: 7px 7px 16px var(--dark), -7px -7px 16px #fff; text-align: center; }
        h1 { margin: 0 0 12px; font-size: clamp(38px, 6vw, 72px); letter-spacing: -0.06em; }
        p { color: var(--muted); margin: 0 0 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 18px; border-radius: 12px; background: linear-gradient(120deg, var(--violet), var(--blue)); color: #fff; box-shadow: 5px 5px 11px #d7dfeb, -4px -4px 10px #fff; font-weight: 700; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <a href="index.html" aria-label="Back to Goodlad Twinstars home">
            <img class="logo" src="BrandAssets/GOODLAD_TWINSTARS_logo_white_bg.svg" alt="Goodlad Twinstars logo" />
        </a>
    </header>

    <main class="card">
        <h1>404</h1>
        <p>The page you’re looking for doesn’t exist or has moved.</p>
        <a class="btn" href="index.html">Return home</a>
    </main>
</div>
</body>
</html>
